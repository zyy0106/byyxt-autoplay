name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JavaScript 语法检查
        run: npm run check

      - name: Python 语法检查
        run: python3 -m py_compile ocr/captcha_ocr.py

      - name: Shell 语法检查
        run: bash -n tools/install-node.sh

      - name: PowerShell 语法检查
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('tools/install-node.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
